<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>找回密码 · InterviewAgent</title>
  <link rel="stylesheet" href="/css/app.css?v=3" />
  <link rel="stylesheet" href="/css/auth.css?v=3" />
</head>
<body>
  <div class="bg"></div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>找回密码</h1>
      <p class="sub">通过邮箱验证码重置密码</p>
      <label for="email">邮箱</label>
      <input class="auth-input" id="email" type="email" required />
      <div class="actions">
        <button type="button" class="ghost" id="btnSend">发送验证码</button>
      </div>
      <label for="code">验证码</label>
      <input class="auth-input" id="code" type="text" autocomplete="one-time-code" />
      <label for="password">新密码</label>
      <input class="auth-input" id="password" type="password" autocomplete="new-password" />
      <p class="auth-error" id="err" role="alert"></p>
      <div class="actions">
        <button type="button" class="primary" id="btnReset">重置密码</button>
      </div>
      <div class="links"><a href="/login.html">返回登录</a></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
  <script>
    (() => {
      const { parseError } = window.IAAuth;
      const err = document.getElementById('err');
      document.getElementById('btnSend').onclick = async () => {
        err.textContent = '';
        const res = await fetch('/api/password/forgot/send-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        if (!res.ok) {
          err.textContent = await parseError(res);
          return;
        }
        err.textContent = '验证码已发送，请查收邮件';
        err.style.color = 'var(--accent)';
      };
      document.getElementById('btnReset').onclick = async () => {
        err.style.color = '';
        err.textContent = '';
        const res = await fetch('/api/password/forgot/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            code: document.getElementById('code').value.trim(),
            newPassword: document.getElementById('password').value
          })
        });
        if (!res.ok) {
          err.textContent = await parseError(res);
          return;
        }
        location.replace('/login.html');
      };
    })();
  </script>
</body>
</html>
