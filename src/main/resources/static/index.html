<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>InterviewAgent</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">InterviewAgent</div>
    <div class="top-actions">
      <span class="user" id="currentUser"></span>
      <a href="/change-password.html" class="ghost" style="padding:0.35rem 0.8rem;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:inherit;font-size:0.85rem">改密</a>
      <button type="button" class="ghost" id="btnLogout" style="padding:0.35rem 0.8rem">登出</button>
      <div class="status" id="wsStatus">未连接</div>
    </div>
  </header>

  <div class="bind-banner" id="bindEmailBanner" hidden>
    <span>请绑定邮箱以便找回密码</span>
    <input id="bindEmail" type="email" placeholder="you@example.com" />
    <button type="button" class="primary" id="btnBindEmail">绑定</button>
    <span class="auth-error" id="bindErr"></span>
  </div>

  <main class="layout">
    <section class="panel setup">
      <h2>开始模拟面试</h2>
      <label>岗位 JD 文本</label>
      <textarea id="jdText" rows="5" placeholder="粘贴 JD 文本…"></textarea>
      <label>或 JD 链接</label>
      <input id="jdUrl" type="url" placeholder="https://..." />
      <label>简历文本</label>
      <textarea id="resumeText" rows="5" placeholder="粘贴简历，或上传 PDF/DOCX"></textarea>
      <div class="row">
        <input id="resumeFile" type="file" accept=".pdf,.docx,.txt,.md" />
        <button id="btnStart" class="primary">开始面试</button>
        <button id="btnQuit" class="ghost">结束面试</button>
      </div>

      <h2>题库上传</h2>
      <div class="row">
        <input id="bankFile" type="file" accept=".pdf,.docx,.txt,.md" />
        <button id="btnUpload" class="ghost">上传题库</button>
      </div>
      <p class="hint">推荐本地格式（无需 LLM）：<br/>
        题：…… / 答：…… 成对编写，或上传 JSON：[{"content":"题目","referenceAnswer":"答案"}]。<br/>
        非标准格式才会调用 DashScope 解析。</p>
    </section>

    <section class="panel chat">
      <h2>对话</h2>
      <div id="messages" class="messages"></div>
      <div class="composer">
        <textarea id="input" rows="2" placeholder="聊天 / 回答面试题 / 「快速测验」「讲解 HashMap」…"></textarea>
        <button id="btnSend" class="primary">发送</button>
      </div>
    </section>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
