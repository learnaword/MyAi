<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · InterviewAgent</title>
  <link rel="stylesheet" href="/css/app.css?v=3" />
  <link rel="stylesheet" href="/css/auth.css?v=3" />
</head>
<body>
  <div class="bg"></div>
  <div class="auth-wrap">
    <form class="auth-card" id="loginForm">
      <h1>InterviewAgent</h1>
      <p class="sub">登录后进入面试或观测界面</p>
      <label for="username">用户名</label>
      <input class="auth-input" id="username" type="text" name="username" autocomplete="username" required />
      <label for="password">密码</label>
      <input class="auth-input" id="password" type="password" name="password" autocomplete="current-password" required />
      <p class="auth-error" id="loginError" role="alert"></p>
      <div class="actions">
        <button type="submit" class="primary">登录</button>
      </div>
      <div class="links">
        <a href="/register.html">注册账号</a>
        ·
        <a href="/forgot-password.html">找回密码</a>
      </div>
    </form>
  </div>
  <script src="/js/auth.js"></script>
  <script>
    (() => {
      const { getToken, getRole, redirectByRole, saveAuth, parseError } = window.IAAuth;
      if (getToken()) {
        redirectByRole(getRole());
        return;
      }
      const err = document.getElementById('loginError');
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        if (!res.ok) {
          err.textContent = await parseError(res);
          return;
        }
        const body = await res.json();
        saveAuth(body);
        redirectByRole(body.role);
      });
    })();
  </script>
</body>
</html>
