<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Observability</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
      --line: #2a3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a44, var(--bg));
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; letter-spacing: 0.02em; }
    p { color: var(--muted); margin: 0 0 20px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
    input {
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      min-width: 160px;
    }
    button {
      background: var(--accent);
      color: #041018;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button:hover { filter: brightness(1.08); }
    pre, table {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      width: 100%;
    }
    pre {
      padding: 14px;
      overflow: auto;
      max-height: 420px;
      font-size: 12px;
      line-height: 1.45;
    }
    table { border-collapse: collapse; margin-top: 12px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; font-size: 13px; }
    th { color: var(--muted); font-weight: 600; }
    .err { color: #ff8e8e; margin-top: 8px; white-space: pre-wrap; }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="head">
    <div>
      <h1>AI Observability</h1>
      <p>管理员观测台 · 使用登录 JWT，按 userId 可筛选链路</p>
    </div>
    <div class="row" style="margin:0">
      <span id="adminUser" style="color:var(--muted);align-self:center"></span>
      <button type="button" class="ghost" id="btnLogout">登出</button>
    </div>
  </div>

  <div class="row">
    <label>TraceId
      <input id="traceIdInput" placeholder="paste traceId" />
    </label>
    <label>UserId（可选）
      <input id="userIdInput" type="number" placeholder="filter userId" />
    </label>
    <button id="btnLoadTrace" type="button">加载链路</button>
  </div>

  <div class="row">
    <label>From
      <input id="fromInput" type="datetime-local" />
    </label>
    <label>To
      <input id="toInput" type="datetime-local" />
    </label>
    <button id="btnLoadStats" type="button">加载统计</button>
    <button id="btnStatus" type="button">模块状态</button>
  </div>

  <div class="row">
    <label>新建管理员用户名
      <input id="adminUsername" />
    </label>
    <label>邮箱
      <input id="adminEmail" type="email" />
    </label>
    <label>密码
      <input id="adminPassword" type="password" />
    </label>
    <button id="btnCreateAdmin" type="button" class="ghost">创建管理员</button>
  </div>

  <div id="err" class="err"></div>
  <pre id="traceView">{}</pre>
  <table id="statsTable">
    <thead><tr><th>指标</th><th>值</th></tr></thead>
    <tbody></tbody>
  </table>

  <script src="/js/auth.js"></script>
  <script src="/js/obs.js"></script>
</body>
</html>
