<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>修改密码 · InterviewAgent</title>
  <link rel="stylesheet" href="/css/app.css?v=3" />
  <link rel="stylesheet" href="/css/auth.css?v=3" />
</head>
<body>
  <div class="bg"></div>
  <div class="auth-wrap">
    <form class="auth-card" id="form">
      <h1>修改密码</h1>
      <p class="sub">修改成功后需重新登录</p>
      <label for="oldPassword">当前密码</label>
      <input class="auth-input" id="oldPassword" type="password" required autocomplete="current-password" />
      <label for="newPassword">新密码</label>
      <input class="auth-input" id="newPassword" type="password" required autocomplete="new-password" />
      <p class="auth-error" id="err" role="alert"></p>
      <div class="actions">
        <button type="submit" class="primary">确认修改</button>
        <a class="ghost" href="javascript:history.back()" style="padding:0.65rem 1.1rem;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:inherit">返回</a>
      </div>
    </form>
  </div>
  <script src="/js/auth.js"></script>
  <script>
    (() => {
      const { getToken, clearAuth, authHeaders, parseError } = window.IAAuth;
      if (!getToken()) {
        location.replace('/login.html');
        return;
      }
      const err = document.getElementById('err');
      document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        err.textContent = '';
        const res = await fetch('/api/password/change', {
          method: 'POST',
          headers: authHeaders(true),
          body: JSON.stringify({
            oldPassword: document.getElementById('oldPassword').value,
            newPassword: document.getElementById('newPassword').value
          })
        });
        if (!res.ok) {
          err.textContent = await parseError(res);
          return;
        }
        clearAuth();
        location.replace('/login.html');
      });
    })();
  </script>
</body>
</html>
