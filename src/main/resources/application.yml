server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: interview-agent

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/interview_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:interview}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${LLM_MODEL:qwen-plus}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:text-embedding-v3}

app:
  milvus:
    enabled: ${MILVUS_ENABLED:false}
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
  jwt:
    secret: ${JWT_SECRET:interview-agent-default-secret}
  auth:
    enabled: ${AUTH_ENABLED:false}
  github:
    token: ${GITHUB_TOKEN:}
  rag:
    top-k: 8
    rerank-top-n: 3
  interview:
    max-questions: ${INTERVIEW_MAX_QUESTIONS:5}
    answer-timeout-seconds: ${INTERVIEW_ANSWER_TIMEOUT:300}
  observability:
    enabled: ${OBS_ENABLED:true}
    retain-days: ${OBS_RETAIN_DAYS:14}
    queue-capacity: 10000
    flush-batch-size: 100
    store-prompt: false
    admin-token: ${OBS_ADMIN_TOKEN:}
    cost-currency: CNY
    default-model: ${LLM_MODEL:qwen-plus}
    attach-trace-id-types: "*"
    pricing:
      qwen-plus:
        input-per-1k: 0.0008
        output-per-1k: 0.002
      default:
        input-per-1k: 0.0008
        output-per-1k: 0.002
